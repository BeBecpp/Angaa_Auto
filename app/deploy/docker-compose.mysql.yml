# Optional MySQL 8.4 test profile for integration/locking tests. Not required to run the local app.
# docker compose -f deploy/docker-compose.mysql.yml up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: angaa_test
      MYSQL_USER: angaa
      MYSQL_PASSWORD: angaa
      MYSQL_ROOT_PASSWORD: root-local-only
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:33060:3306"
    tmpfs:
      - /var/lib/mysql
